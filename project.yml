name: Scraps
options:
  bundleIdPrefix: com.joaocosta
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  configs:
    Debug:
      ICLOUD_ENVIRONMENT: Development
      APS_ENVIRONMENT: development
    Release:
      ICLOUD_ENVIRONMENT: Production
      APS_ENVIRONMENT: production
      OTHER_CODE_SIGN_FLAGS: --timestamp
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  StickyKit:
    path: Packages/StickyKit
targets:
  Scraps:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/Scraps
      - path: App/Shared/Assets.xcassets
    info:
      path: App/Scraps/Info.plist
      properties:
        CFBundleDisplayName: Scraps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleLocalizations: [en, pt-BR]
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [com.joaocosta.Scraps.edit]
        CFBundleURLTypes:
          - CFBundleURLName: com.joaocosta.Scraps
            CFBundleURLSchemes: [scraps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.Scraps
        PRODUCT_NAME: Scraps
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        DEVELOPMENT_TEAM: 33FPG9442W
        CODE_SIGN_ENTITLEMENTS: App/Scraps/Scraps.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ARCHS: arm64
    dependencies:
      - package: StickyKit
        product: StickyDomain
      - package: StickyKit
        product: StickyEditor
      - package: StickyKit
        product: StickyIntents
      - package: StickyKit
        product: StickyStorage
      - package: StickyKit
        product: StickyUI
      - package: StickyKit
        product: StickySync
      - target: ScrapsWidgetsMac
        embed: true
  ScrapsMobile:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/ScrapsMobile
      - path: App/Shared/Assets.xcassets
      - path: App/Scraps/PrivacyInfo.xcprivacy
    info:
      path: App/ScrapsMobile/Info.plist
      properties:
        CFBundleDisplayName: Scraps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, pt-BR]
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [com.joaocosta.Scraps.edit]
        CFBundleURLTypes:
          - CFBundleURLName: com.joaocosta.Scraps
            CFBundleURLSchemes: [scraps]
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.Scraps
        PRODUCT_NAME: Scraps
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 33FPG9442W
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/ScrapsMobile/ScrapsMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: StickyKit
        product: StickyDomain
      - package: StickyKit
        product: StickyStorage
      - package: StickyKit
        product: StickyMobileUI
      - package: StickyKit
        product: StickyIntents
      - package: StickyKit
        product: StickySync
      - target: ScrapsWidgetsMobile
        embed: true
  ScrapsWidgetsMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/ScrapsWidgets
        excludes: [Info-Mac.plist, Info-Mobile.plist]
      - path: App/Scraps/PrivacyInfo.xcprivacy
    info:
      path: App/ScrapsWidgets/Info-Mac.plist
      properties:
        CFBundleDisplayName: Scraps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, pt-BR]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.Scraps.widgets
        PRODUCT_NAME: ScrapsWidgets
        DEVELOPMENT_TEAM: 33FPG9442W
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/ScrapsWidgets/ScrapsWidgetsMac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES
        ARCHS: arm64
    dependencies:
      - package: StickyKit
        product: StickyDomain
      - package: StickyKit
        product: StickyStorage
      - package: StickyKit
        product: StickyEditor
  ScrapsWidgetsMobile:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/ScrapsWidgets
        excludes: [Info-Mac.plist, Info-Mobile.plist]
      - path: App/Scraps/PrivacyInfo.xcprivacy
    info:
      path: App/ScrapsWidgets/Info-Mobile.plist
      properties:
        CFBundleDisplayName: Scraps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, pt-BR]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.Scraps.widgets
        PRODUCT_NAME: ScrapsWidgets
        DEVELOPMENT_TEAM: 33FPG9442W
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/ScrapsWidgets/ScrapsWidgetsMobile.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: StickyKit
        product: StickyDomain
      - package: StickyKit
        product: StickyStorage
      - package: StickyKit
        product: StickyEditor
schemes:
  Scraps:
    build:
      targets:
        Scraps: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: StickyKit/StickyDomainTests
        - package: StickyKit/StickyStorageTests
        - package: StickyKit/StickyEditorTests
        - package: StickyKit/StickyUITests
        - package: StickyKit/StickyIntentsTests
  ScrapsMobile:
    build:
      targets:
        ScrapsMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: StickyKit/StickyDomainTests
        - package: StickyKit/StickyStorageTests
        - package: StickyKit/StickyEditorTests
        - package: StickyKit/StickyIntentsTests
        - package: StickyKit/StickyMobileUITests
