name: Native builds
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple SDKs
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Generate project
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          git diff --exit-code -- Scraps.xcodeproj App/Scraps/Info.plist App/ScrapsMobile/Info.plist
      - name: Package rules
        run: |
          python3 Scripts/verify-localizations.py
          bash -n Scripts/dev-install.sh Scripts/archive.sh
          swift test --package-path Packages/StickyKit
      - name: macOS build
        run: |
          xcodebuild -project Scraps.xcodeproj -scheme Scraps -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build.noindex/DerivedData \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      - name: Verify Mac development product
        run: |
          PRODUCT=build.noindex/DerivedData/Build/Products/Debug/Scraps.app
          python3 Scripts/resolve-entitlements.py App/Scraps/Scraps.entitlements build.noindex/Debug.entitlements --configuration Debug --team 33FPG9442W
          python3 Scripts/resolve-entitlements.py App/ScrapsWidgets/ScrapsWidgetsMac.entitlements build.noindex/Widget.entitlements --configuration Debug --team 33FPG9442W
          codesign --force --sign - --entitlements build.noindex/Widget.entitlements "$PRODUCT/Contents/PlugIns/ScrapsWidgets.appex"
          codesign --force --sign - --entitlements build.noindex/Debug.entitlements "$PRODUCT"
          codesign --verify --deep --strict "$PRODUCT"
          codesign -d --entitlements - --xml "$PRODUCT"
          python3 Scripts/verify-product.py "$PRODUCT"
          ditto -c -k --sequesterRsrc --keepParent "$PRODUCT" build.noindex/Scraps-macOS.zip
      - name: iOS and iPadOS build
        run: |
          xcodebuild -project Scraps.xcodeproj -scheme ScrapsMobile -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build.noindex/DerivedData \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
          python3 Scripts/verify-product.py build.noindex/DerivedData/Build/Products/Debug-iphonesimulator/Scraps.app
      - name: Release archives
        run: |
          xcodebuild -project Scraps.xcodeproj -scheme Scraps -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build.noindex/DerivedData \
            -archivePath build.noindex/Archives/Scraps.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
          xcodebuild -project Scraps.xcodeproj -scheme ScrapsMobile -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build.noindex/DerivedData \
            -archivePath build.noindex/Archives/ScrapsMobile.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
          PRODUCT=build.noindex/Archives/Scraps.xcarchive/Products/Applications/Scraps.app
          python3 Scripts/resolve-entitlements.py App/Scraps/Scraps.entitlements build.noindex/Release.entitlements --configuration Release --team 33FPG9442W
          codesign --force --sign - --options runtime --entitlements build.noindex/Widget.entitlements "$PRODUCT/Contents/PlugIns/ScrapsWidgets.appex"
          codesign --force --sign - --options runtime --entitlements build.noindex/Release.entitlements "$PRODUCT"
          codesign --verify --deep --strict "$PRODUCT"
          codesign -d --entitlements - --xml "$PRODUCT"
          python3 Scripts/verify-product.py "$PRODUCT" --release
          python3 Scripts/verify-product.py build.noindex/Archives/ScrapsMobile.xcarchive/Products/Applications/Scraps.app --release
          ditto -c -k --sequesterRsrc --keepParent "$PRODUCT" build.noindex/Scraps-macOS-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Scraps-macOS-development
          path: build.noindex/Scraps-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Scraps-release
          path: |
            build.noindex/Scraps-macOS-release.zip
            build.noindex/Archives
